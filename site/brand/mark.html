<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Inter:wght@800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body>
<svg id="s" width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".46" r=".62"><stop offset="0" stop-color="#0d1f15"/><stop offset=".55" stop-color="#040806"/><stop offset="1" stop-color="#000"/></radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dffb4"/><stop offset="1" stop-color="#2fd57a"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151a17"/><stop offset="1" stop-color="#0a0d0b"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="pill"><rect x="150" y="355" width="700" height="290" rx="145"/></clipPath>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <g transform="rotate(-30 500 500)">
    <rect x="150" y="355" width="700" height="290" rx="145" fill="#3fe08e" opacity=".35" filter="url(#glow)"/>
    <g clip-path="url(#pill)">
      <rect x="150" y="355" width="350" height="290" fill="url(#g)"/>
      <rect x="500" y="355" width="350" height="290" fill="url(#dark)"/>
      <rect x="150" y="355" width="700" height="60" fill="#fff" opacity=".08"/>
    </g>
    <rect x="150" y="355" width="700" height="290" rx="145" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="5"/>
  </g>
  <!-- the terminal half: an upright prompt and cursor -->
  <g transform="translate(652 412)">
    <path d="M -78 -44 L -28 0 L -78 44" fill="none" stroke="#3fe08e" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="2" y="30" width="76" height="24" rx="5" fill="#3fe08e"/>
  </g>
  <g id="t"></g>
</svg>
<script>
const Q = new URLSearchParams(location.search)
if (Q.get('text')) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'text'); Object.entries({ x: 500, y: 905, 'text-anchor': 'middle', fill: '#fff', 'font-family': 'JetBrains Mono', 'font-weight': 800, 'font-size': 76, 'letter-spacing': 6 }).forEach(([k, v]) => t.setAttribute(k, v)); t.textContent = 'PUMPMCP'; document.getElementById('t').appendChild(t) }
document.fonts.ready.then(() => { window.READY = true })
</script>
</body></html>
